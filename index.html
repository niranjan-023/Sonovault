<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sonovault</title>
<meta name="description" content="Your favorite playlists, archived securely as text and tone.">
<meta property="og:title" content="Sonovault">
<meta property="og:description" content="Your favorite playlists, archived securely as text and tone.">
<meta name="theme-color" content="#12100e">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="/" aria-label="Sonovault home">
    <img src="logo-mark.png" alt="" width="26" height="30">
    <span>Sonovault</span>
  </a>
  <span class="tag">YouTube playlist archiver</span>
</header>

<main>
  <section class="hero">
    <div class="copy">
      <h1>Your favorite playlists, archived securely as text and tone.</h1>
      <p class="lead">Paste a YouTube playlist link to save every title as a text file, or convert the whole playlist to MP3s in one .zip.</p>

      <label for="url">Playlist link</label>
      <div class="field">
        <input id="url" type="text" placeholder="https://www.youtube.com/playlist?list=PL..." autocomplete="off">
        <button id="go">Get video names</button>
      </div>

      <div class="opts">
        <label class="chip"><input type="checkbox" id="num" checked><span>Number the titles</span></label>
        <label class="chip"><input type="checkbox" id="urls"><span>Include video links</span></label>
      </div>
      <div id="status" role="status" aria-live="polite"></div>
    </div>

    <div class="art" aria-hidden="true">
      <img class="mark" src="logo-mark.png" alt="" width="260" height="296">
      <div class="bars"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    </div>
  </section>

  <section id="result" class="panel">
    <div class="panel-head">
      <div>
        <h2 id="plname">Playlist</h2>
        <p id="count"></p>
      </div>
      <input id="filter" type="text" placeholder="Filter tracks" aria-label="Filter tracks" autocomplete="off">
    </div>
    <ol id="list" class="tracks"></ol>
    <div class="actions">
      <button id="dl">Download .txt</button>
      <button id="copy" class="alt">Copy to clipboard</button>
      <button id="mp3" class="alt">Download MP3 .zip</button>
      <select id="bitrate" aria-label="MP3 quality">
        <option value="128">128 kbps</option>
        <option value="192" selected>192 kbps</option>
        <option value="256">256 kbps</option>
        <option value="320">320 kbps</option>
      </select>
    </div>

    <div id="audio" class="audio">
      <div class="audio-head">
        <span id="astatus"></span>
        <button id="acancel" class="alt small">Cancel</button>
      </div>
      <div class="meter"><i id="afill"></i></div>
    </div>
    <p id="anote" class="anote" role="status" aria-live="polite"></p>
  </section>
</main>

<footer>
  <img src="logo-mark.png" alt="" width="14" height="16">
  <span>Sonovault fetches titles through the YouTube Data API.</span>
</footer>
<script src="script.js"></script>
</body>
</html>
